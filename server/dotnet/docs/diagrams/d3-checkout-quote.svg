        <title id="d3-checkout-quote-title">Checkout quote</title>
        <desc id="d3-checkout-quote-desc">Sequence showing a checkout quote travelling from the storefront widget through the partner platform quote proxy, which binds the request to a retailer before calling Seel with the server-side API key.</desc>
