      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:    'Fira Code', ui-monospace, monospace; }
      #d3-checkout-quote-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d3-checkout-quote-root .diagram-container { width: 100%; overflow-x: auto; }
      #d3-checkout-quote-root .diagram-container { overflow-x: visible; }</style>
