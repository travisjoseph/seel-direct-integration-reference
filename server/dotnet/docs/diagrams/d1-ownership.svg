      --font-mono:    'Fira Code', ui-monospace, monospace; }
      #d1-ownership-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d1-ownership-root .diagram-container { width: 100%; overflow-x: auto; }
      #d1-ownership-root .diagram-container { overflow-x: visible; }</style>
