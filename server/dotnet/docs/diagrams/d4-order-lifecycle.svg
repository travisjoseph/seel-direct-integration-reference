        <title id="d4-order-lifecycle-title">Order lifecycle</title>
        <desc id="d4-order-lifecycle-desc">Sequence showing the partner platform order pipeline creating every order, recording fulfillment, and cancelling through SeelClient, with Seel answering through contract webhooks.</desc>
